server {
	listen 80;
	root /usr/share/nginx/html;

	# Hashed build assets never change, so they can be cached forever.
	location /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Missing build files should 404, not fall back to the HTML page below.
	location /_app/ {
		try_files $uri =404;
	}

	# adapter-static's fallback page handles client-side routes (e.g. /tournaments/123).
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ $uri.html /index.html;
	}
}
